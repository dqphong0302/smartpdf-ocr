name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
      - run: uv run --with-requirements backend/requirements-dev.txt ruff check backend
      - run: uv run --with-requirements backend/requirements-dev.txt pytest -q backend/tests
      - run: uv run --with-requirements backend/requirements.txt python -m py_compile backend/*.py

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            mcp-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: mcp-server
      - run: node --check index.js
        working-directory: mcp-server
